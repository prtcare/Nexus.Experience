name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------- .NET half ----------------
  build:
    runs-on: ubuntu-latest

    # This repo consumes Nexus.Intelligence.Contracts from GitHub Packages
    # (nuget.config -> github-prtcare feed), so the restore step needs the
    # private-feed credentials. They come from repo secrets only - never inline.
    env:
      # nuget.config reads these two env vars (as %GITHUB_PACKAGES_USERNAME% /
      # %GITHUB_PACKAGES_TOKEN%). They're sourced from the canonical
      # GITHUB_PACKAGES_* secret names (as used on Nexus.Intelligence), with the
      # shorter PACKAGES_* variants as a fallback since both have been in use on
      # this repo. A missing secret evaluates to an empty string, so either set
      # resolves; neither set -> empty creds -> restore 401s.
      GITHUB_PACKAGES_USERNAME: ${{ secrets.GITHUB_PACKAGES_USERNAME || secrets.PACKAGES_USERNAME }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || secrets.PACKAGES_TOKEN }}

    # M-08-1.3: the result artifact carries StartedAt. The first step below
    # stamps it and this job output carries it to the ci-result job, so a run
    # that dies early still reports when it started.
    outputs:
      started_at: ${{ steps.capture_started_at.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # M-08-1.3: captured before restore/build/test, mirroring Nexus.Platform,
      # so a run that dies at any point still emits a truthful start time.
      - name: Capture run start time
        id: capture_started_at
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # SDK version is read from global.json (10.0.302, matching Nexus.Platform)
      # rather than hardcoded here, so the pipeline stays in sync with the
      # repo's pinned SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The solution also contains the client's .esproj, so the JavaScript SDK
      # wants a Node runtime present even though the esproj sets
      # ShouldRunBuildScript=false (the npm build is owned by the `frontend`
      # job below). Pin the same Node the client targets.
      - name: Setup Node (for client esproj)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # nuget.config pins the feed list (<clear/> then nuget.org + github-prtcare)
      # and reads %GITHUB_PACKAGES_USERNAME% / %GITHUB_PACKAGES_TOKEN% from the
      # job env above. This is the one step that differs from Nexus.Platform,
      # which has no private feed and restores with no credentials.
      - name: Restore
        run: dotnet restore Nexus.Experience.slnx

      - name: Build
        run: dotnet build Nexus.Experience.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Nexus.Experience.slnx -c Release --no-build --logger trx --results-directory ./artifacts/test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/artifacts/test-results
          if-no-files-found: warn

  # ---------------- Frontend half ----------------
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Nexus.Experience.Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 is pinned here because the client has no .nvmrc and no engines
      # field. 24 matches the dev machines and satisfies Vite 8's requirement of
      # ^20.19.0 || >=22.12.0.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Nexus.Experience.Client/package-lock.json

      # npm ci (not npm install) for a reproducible, lockfile-exact install.
      - name: Install dependencies
        run: npm ci

      # Typecheck, build and lint are separate steps so a failure in any one of
      # them shows up as its own red step rather than a generic "build failed".
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  # ---------------- Combined CI result artifact ----------------
  # M-08-1.3: machine-readable CI result, mirrored from Nexus.Platform. One
  # artifact per run named ci-result-<branch> - the branch-name-encoded retrieval
  # convention Nexus.Platform established; a second artifact per stage would
  # either collide on the same name or invent a second naming convention, so the
  # result is combined here. The frontend half has no test runner, so test counts
  # come from the .NET half's trx files; the outcome is the worst of the two
  # halves, so a red frontend typecheck is not reported as a green .NET run.
  ci-result:
    runs-on: ubuntu-latest
    if: always()
    needs: [build, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Test counts come from the .NET half's trx files (uploaded by the build
      # job's "Upload test results" step, itself if: always()). If the .NET half
      # failed before producing trx files, the download warns and the emit step
      # zeroes the counts - still a truthful Failure artifact.
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Write run start time
        shell: pwsh
        run: |
          $startedAt = "${{ needs.build.outputs.started_at }}"
          if ($startedAt) {
            New-Item -ItemType Directory -Force ci-results | Out-Null
            Set-Content -Path ci-results/started-at -Value $startedAt -Encoding utf8
          }

      - name: Compute combined outcome
        id: combined_outcome
        run: |
          # failure wins; otherwise cancelled; otherwise a half that never ran
          # (skipped) reads as cancelled; else success.
          status="success"
          for result in "${{ needs.build.result }}" "${{ needs.frontend.result }}"; do
            case "$result" in
              failure)
                status="failure"
                ;;
              cancelled)
                if [ "$status" != "failure" ]; then status="cancelled"; fi
                ;;
              skipped)
                if [ "$status" = "success" ]; then status="cancelled"; fi
                ;;
            esac
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Runs whether the run passed or failed so every run publishes an artifact.
      # The artifact name encodes the branch, with characters GitHub artifact
      # names forbid (slashes in particular) replaced, so a caller can identify
      # the run's result by branch.
      - name: Emit CI result artifact
        id: emit
        shell: pwsh
        run: |
          # push -> github.ref_name is the branch; pull_request -> github.ref_name is
          # "<pr>/merge", so use the PR source branch. The branch name is the join key
          # DEVELOPER matches to a work item (DELIVERY_ARCHITECTURE.md 4.2).
          $branch = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "pull_request") { $branch = "${{ github.head_ref }}" }

          ./scripts/emit-ci-result.ps1 `
            -Repository "${{ github.repository }}" `
            -Branch $branch `
            -CommitSha "${{ github.sha }}" `
            -WorkflowRunId "${{ github.run_id }}" `
            -JobStatus "${{ steps.combined_outcome.outputs.status }}" `
            -TrxDirectory ./artifacts/test-results `
            -StartedAtFile ci-results/started-at `
            -OutputPath ci-results/result.json

          $safeBranch = ($branch -replace '[^A-Za-z0-9._-]', '-')
          if ($safeBranch.Length -gt 120) { $safeBranch = $safeBranch.Substring(0, 120) }
          $safeBranch = $safeBranch.TrimEnd('-')
          Write-Output "artifact_name=ci-result-$safeBranch" >> $env:GITHUB_OUTPUT

      - name: Upload CI result artifact
        if: always() && steps.emit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.emit.outputs.artifact_name }}
          path: ci-results/result.json
          if-no-files-found: error
